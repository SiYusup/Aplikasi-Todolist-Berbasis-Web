<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List API — Swagger Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; }
    #topbar {
      padding: 12px 20px;
      background: #18181b;
      color: #fafafa;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    #topbar a { color: #a1a1aa; }
    #topbar code { background: #27272a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="topbar">
    <strong>To-Do List API</strong> — Swagger UI &nbsp;·&nbsp;
    Spec: <code>documents/openapi.yaml</code> &nbsp;·&nbsp;
    PRD: <a href="./PRD.md">PRD.md</a> &nbsp;·&nbsp;
    Server lokal: <code>http://localhost:8000</code>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: './openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: true,
      displayRequestDuration: true,
    });
  </script>
</body>
</html>
